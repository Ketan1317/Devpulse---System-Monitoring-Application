name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: 
  
permissions: 
  contents: write

jobs:
  update-readMe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # clones the repo

      - name: Update date
        run: |
          date > last-updated.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last-updated.txt
          git commit -m "chore: update README" || exit 0
          git push
